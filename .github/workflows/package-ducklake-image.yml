name: Package DuckLake ClickHouse image from release binary

# Packages the clickhouse-ducklake server image from a prebuilt binary
# published as a release asset (see release ducklake-26.4.2-1). This is the
# fast path while the full source-build workflow (build-ducklake-image.yml)
# is validated on Depot runners: the binary it ships was built and tested
# externally (16/16 DuckLake integration tests, 13/13 gtests, variant
# stateless tests).

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release whose `clickhouse` asset to package
        required: true
        default: ducklake-26.4.2-1
      image_tag:
        description: Image tag to publish
        required: true
        default: 26.4.2-ducklake.1

permissions:
  contents: read
  packages: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download binary from release
        run: |
          mkdir -p image
          gh release download ${{ inputs.release_tag }} \
            --repo PostHog/clickhouse --pattern clickhouse --dir image --clobber
          chmod +x image/clickhouse
          image/clickhouse local -q 'SELECT version()'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble image context
        run: |
          git clone --depth=1 --branch port/ducklake-read-antalya-26.4 https://github.com/PostHog/clickhouse.git src
          cp src/docker/server/entrypoint.sh src/docker/server/docker_related_config.xml image/
          cp src/programs/server/config.xml src/programs/server/users.xml image/
          cat > image/Dockerfile <<'DOCKERFILE'
          FROM ubuntu:22.04
          ARG DEBIAN_FRONTEND=noninteractive
          RUN groupadd -r clickhouse --gid=101 \
              && useradd -r -g clickhouse --uid=101 --home-dir=/var/lib/clickhouse --shell=/bin/bash clickhouse \
              && apt-get update \
              && apt-get install --yes --no-install-recommends busybox ca-certificates locales tzdata \
              && busybox --install -s \
              && rm -rf /var/lib/apt/lists/* /var/cache/debconf /tmp/*
          COPY clickhouse /usr/bin/clickhouse
          RUN chmod +x /usr/bin/clickhouse \
              && for app in server client local benchmark keeper keeper-client extract-from-config compressor format obfuscator; do \
                  ln -s /usr/bin/clickhouse /usr/bin/clickhouse-$app; done \
              && mkdir -p /var/lib/clickhouse /var/log/clickhouse-server \
                  /etc/clickhouse-server/config.d /etc/clickhouse-server/users.d /docker-entrypoint-initdb.d \
              && chown -R clickhouse:clickhouse /var/lib/clickhouse /var/log/clickhouse-server /etc/clickhouse-server
          COPY config.xml users.xml /etc/clickhouse-server/
          COPY docker_related_config.xml /etc/clickhouse-server/config.d/
          COPY entrypoint.sh /entrypoint.sh
          RUN chmod +x /entrypoint.sh && chown -R clickhouse:clickhouse /etc/clickhouse-server
          ENV CLICKHOUSE_CONFIG=/etc/clickhouse-server/config.xml
          USER 101
          ENTRYPOINT ["/entrypoint.sh"]
          DOCKERFILE

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: image
          push: true
          tags: ghcr.io/posthog/clickhouse-ducklake:${{ inputs.image_tag }}
